<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Payment Gateway | PRIS Candles</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/tPXMYjJK/ammi-1.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              cream: '#FAFAF9',
              darkBg: '#09090B',
              darkCard: '#18181B'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-brand-cream dark:bg-brand-darkBg text-zinc-900 dark:text-zinc-100 font-sans">

  <header class="bg-white dark:bg-brand-darkCard border-b border-zinc-200 py-3.5 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <img src="https://i.ibb.co/tPXMYjJK/ammi-1.png" alt="PRIS Logo" class="w-8 h-8 object-contain">
        <span class="font-serif text-xl font-bold text-zinc-900 dark:text-white">PRIS Candles</span>
      </a>
      <a href="checkout.html" class="text-xs font-semibold text-zinc-500 hover:text-zinc-900">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back
      </a>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-8 sm:py-12">
    <div class="bg-white dark:bg-brand-darkCard p-6 sm:p-8 rounded-3xl border border-zinc-200 dark:border-zinc-800 shadow-xl space-y-5 text-center">
      
      <div class="w-12 h-12 mx-auto rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 flex items-center justify-center text-xl">
        <i class="fa-solid fa-credit-card"></i>
      </div>

      <div>
        <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">
          Available Soon
        </span>
        <h1 class="font-serif text-xl sm:text-2xl font-bold text-zinc-900 dark:text-white mt-2.5">Online Card Gateway</h1>
        <p class="text-xs text-zinc-500 mt-1">
          Direct Visa & MasterCard payment is currently being activated for PRIS Candles.
        </p>
      </div>

      <div class="bg-zinc-50 dark:bg-zinc-900/60 p-4 rounded-2xl border border-zinc-200 dark:border-zinc-800 text-left text-xs space-y-2">
        <div class="flex justify-between border-b border-zinc-200 dark:border-zinc-800 pb-2">
          <span class="text-zinc-500">Order Ref:</span>
          <span id="display-order-id" class="font-bold text-zinc-900 dark:text-white font-mono">PRIS-PENDING</span>
        </div>
        <div class="flex justify-between border-b border-zinc-200 dark:border-zinc-800 pb-2">
          <span class="text-zinc-500">Customer:</span>
          <span id="display-customer-name" class="font-bold text-zinc-900 dark:text-white">-</span>
        </div>
        <div class="flex justify-between border-b border-zinc-200 dark:border-zinc-800 pb-2">
          <span class="text-zinc-500">Destination:</span>
          <span id="display-customer-city" class="font-bold text-zinc-900 dark:text-white">-</span>
        </div>
        <div class="flex justify-between pt-1 text-sm font-bold text-zinc-900 dark:text-white">
          <span>Amount Payable:</span>
          <span id="display-total-amount">Rs. 0</span>
        </div>
      </div>

      <div class="space-y-2.5 pt-1">
        <p class="text-xs font-semibold text-zinc-600 dark:text-zinc-400">Complete this order directly via WhatsApp:</p>
        <button onclick="payViaWhatsAppFallback()" class="w-full py-3.5 rounded-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs uppercase tracking-wider shadow-md transition flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-base"></i>
          <span>Complete on WhatsApp (076 075 3587)</span>
        </button>

        <a href="index.html" class="block text-xs text-zinc-500 hover:text-zinc-800 pt-1">Return to Home</a>
      </div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    let activeOrder = null;
    document.addEventListener("DOMContentLoaded", () => {
      const savedOrder = localStorage.getItem("pris_current_order");
      if (savedOrder) {
        try { activeOrder = JSON.parse(savedOrder); } catch(e) {}
      }

      if (activeOrder) {
        document.getElementById("display-order-id").textContent = activeOrder.orderId;
        document.getElementById("display-customer-name").textContent = activeOrder.customer.name;
        document.getElementById("display-customer-city").textContent = `${activeOrder.customer.city}, Sri Lanka`;
        document.getElementById("display-total-amount").textContent = `Rs. ${activeOrder.total.toLocaleString()}`;
      }
    });

    function payViaWhatsAppFallback() {
      if (!activeOrder) {
        window.open("https://wa.me/94760753587", "_blank");
        return;
      }
      let msg = `*PRIS CANDLES - CARD ORDER TO WHATSAPP (${activeOrder.orderId})*%0A`;
      msg += `------------------------------%0A`;
      activeOrder.items.forEach((i, idx) => {
        msg += `${idx + 1}. *${i.name}* (x${i.qty}) = Rs. ${i.price * i.qty}%0A`;
      });
      msg += `------------------------------%0A`;
      msg += `*TOTAL AMOUNT:* Rs. ${activeOrder.total}%0A%0A`;
      msg += `Customer: ${activeOrder.customer.name}%0A`;
      msg += `Phone: ${activeOrder.customer.phone}%0A`;
      msg += `Address: ${activeOrder.customer.address}, ${activeOrder.customer.city}%0A`;
      msg += `%0A(Note: Bank transfer or cash upon delivery)`;

      localStorage.removeItem("pris_cart");
      window.open(`https://wa.me/94760753587?text=${msg}`, "_blank");
    }
  </script>
</body>
</html>
